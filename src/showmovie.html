<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Show specific movie</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
<header class="page-header">
    <a href="index.html" class="logo-link"> Kino XP</a>
</header>
<main>

    <section class="movie-container">

        <div class="movie-image">
            <img id="moviePoster" src="" alt="Plakat">
        </div>

        <div class="movie-info">
            <h2 id="movieTitle"></h2>

            <p>
                <strong>Instruktør:</strong>
                <span id="movieDirector"></span>
            </p>

            <p>
                <strong>Premiere:</strong>
                <span id="moviePremiere"></span>
            </p>

            <p>
                <strong>Information om filmen:</strong>
                <span id="movieDescription"></span>
            </p>

            <p>
                <strong>Rating:</strong>
                <span id="movieRating"></span>
            </p>

            <p>
                <strong>Genre:</strong>
                <span id="movieGenre"></span>
            </p>


            <div id="showingList"></div>
        </div>

    </section>

</main>
<script type="module" src="js/showmovie.js"></script>

</body>
</html>
